name: Release Lucy
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: windows-2025, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Toolchain
        shell: bash
        run: rustup toolchain install 1.96.1 --profile minimal --target ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test and build
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == Windows ]]; then
            RUST_BACKTRACE=1 cargo +1.96.1 test --locked --workspace --target ${{ matrix.target }} -- --test-threads=1 --nocapture
          else
            cargo +1.96.1 test --locked --workspace --target ${{ matrix.target }}
          fi
          cargo +1.96.1 build --locked --release --target ${{ matrix.target }}
      - name: Native binary smoke and archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/package.py
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
