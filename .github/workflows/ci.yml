name: Verify Lucy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: rustup toolchain install 1.96.1 --profile minimal --component clippy,rustfmt
      - run: cargo +1.96.1 fmt --all -- --check
      - run: cargo +1.96.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.96.1 test --locked --workspace
      - run: python3 scripts/verify-extraction.py
      - run: python3 scripts/verify-pins.py
      - run: cargo +1.96.1 run --release --locked -- check
        env:
          LUCY_HOME: lucy
          LUCY_DATA_DIR: /tmp/lucy-public-memory-check
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: nix develop .#desktop --command just ci-desktop
