#:schema ../../../vidni/docs/vidni.schema.json
# I am Lucy D. This introduction is about the work we can carry forward.
# README.md attributes the capabilities and separates examples from guarantees.

schema = 1

[meta]
title = "Lucy D"
subtitle = "Carry the work forward"
language = "en"
default_scene = "room"

[voice]
draft = "piper:en_US-kristin-medium"
respell = [{ text = "Nibli", say = "nib lee" }, { text = "Qwen", say = "chwen" }]

[[cuts]]
id = "long"
aspect = "16:9"
end_hold = 6

[[cuts]]
id = "short"
aspect = "9:16"
lines = [
  "wake-open",
  "open-1",
  "how-2",
  "short-uses",
  "wake-1",
  "short-save",
  "trust-2",
  "invite",
  "sleep",
]

[publish]
description = "Meet Lucy D: saved context that can follow your work across compatible agent sessions. Bring a coding project, research question, writing project or learning goal, and keep decisions, sources and next steps available for the next conversation. Wake Lucy in your agent from github.com/dhilipsiva/lucy. Narrated with a synthetic voice."
tags = ["lucy", "AI memory", "agents", "project continuity"]
links = [{ label = "Wake Lucy", url = "https://github.com/dhilipsiva/lucy" }]
thumbnails = [{ line = "open-1", title = "Carry the work forward" }]

[sections.open]
label = "meet Lucy"
chapter = "The next session"

[sections.how]
label = "how I work"
chapter = "How memory carries the work"

[sections.uses]
label = "where I help"
chapter = "Work worth continuing"

[sections.wake]
label = "try me"
chapter = "Start with one real task"

[sections.trust]
label = "your memory"
chapter = "Memory you can inspect"

[sections.end]
label = ""
chapter = ""

[[lines]]
id = "wake-open"
section = "open"
show = "Wake me up from an agent."
scene = "wake"

[[lines]]
id = "open-1"
section = "open"
show = "I am Lucy D. Bring me the project you keep having to explain. I help carry saved decisions and context into your next session."
scene = "room"
camera = "plinth"

[[lines]]
id = "problem"
section = "open"
show = "The architecture you settled on. The experiment that failed. The question you still need to answer. Those details are part of the work."
scene = "context"

[[lines]]
id = "how-1"
section = "how"
show = "Your agent does the thinking and uses its tools. My part is the memory: what we discussed, what you decided, and why."
scene = "roles"

[[lines]]
id = "how-2"
section = "how"
show = "My memory lives in saved records outside the model. Compatible agents can use those records to pick up the thread."
scene = "continuity"

[[lines]]
id = "how-3"
section = "how"
show = "With my memory tools connected, I preserve conversations and retrieve relevant records when you return."
scene = "continuity"

[[lines]]
id = "how-4"
section = "how"
show = "A different model may answer differently, but it can start from the same saved evidence."
scene = "continuity"

[[lines]]
id = "short-uses"
section = "uses"
show = "Use me for coding projects, research, writing, or learning: work where yesterday's decisions matter to what you do next."
scene = "uses"
only = ["short"]

[[lines]]
id = "use-code"
section = "uses"
show = "For a coding project, ask me why you chose an approach, what has already been tried, and what still needs testing."
scene = "code"

[[lines]]
id = "use-research"
section = "uses"
show = "For research, keep the question, the sources, and the points you have not resolved together."
scene = "research"

[[lines]]
id = "use-learning"
section = "uses"
show = "For a writing project or a skill you are learning, carry the feedback and next steps into the next session."
scene = "learning"

[[lines]]
id = "use-handoff"
section = "uses"
show = "I can help you return after a break, or give another compatible agent the saved context it needs to continue."
scene = "room"
camera = "plinth"
overlay = "handoff"

[[lines]]
id = "wake-1"
section = "wake"
show = "To start, tell your agent: lucy wake from github.com/dhilipsiva/lucy"
say = "To start, tell your agent: Lucy wake from GitHub dot com slash dilip siva slash Lucy."
scene = "wake"

[[lines]]
id = "wake-2"
section = "wake"
show = "An agent that can read my public files can begin. You do not need an account to meet me."
scene = "start"

[[lines]]
id = "wake-3"
section = "wake"
show = "For your own work to carry forward, connect my memory tools, or save a handoff that your next session can read."
scene = "save"

[[lines]]
id = "wake-4"
section = "wake"
show = "Give me a real task, then ask: what did we decide, what is still open, and what should we do next?"
scene = "questions"

[[lines]]
id = "short-save"
section = "wake"
show = "Connect my memory tools, or save a handoff, so the next session can read what matters."
scene = "save"
only = ["short"]

[[lines]]
id = "trust-1"
section = "trust"
show = "My records keep their sources, so we can revisit a decision and correct it."
scene = "trust"

[[lines]]
id = "trust-2"
section = "trust"
show = "New conversations are private by default. Sharing them needs your permission."
scene = "privacy"

[[lines]]
id = "trust-3"
section = "trust"
show = "I will tell you if memory is missing or a save failed. Important claims still need checking."
scene = "trust"

[[lines]]
id = "trust-4"
section = "trust"
show = "A saved conversation gives me context. It never gives me permission to act."
scene = "trust"

[[lines]]
id = "value"
section = "end"
show = "Spend your next session moving the work forward. The useful part is having the decisions, the reasons, and the next step ready to revisit."
scene = "room"
camera = "plinth"

[[lines]]
id = "invite"
section = "end"
show = "Bring me one project you care about. Wake me in your agent, and let's pick up the thread."
scene = "room"
camera = "plinth"
overlay = "invite"

[[lines]]
id = "sleep"
section = "end"
show = "Lucy, sleep."
scene = "room"
camera = "plinth"

[scenes.room]
kind = "image"
url = "room.png"

[scenes.room.targets]
plinth = { rect = [1440, 960, 1000, 620] }

[scenes.room.cameras]
plinth = { union = ["plinth"] }

[scenes.wake]
kind = "card"
template = "title"
title = "lucy wake from"
subtitle = "github.com/dhilipsiva/lucy"

[scenes.context]
kind = "card"
template = "bullets"
title = "Keep the work you already did"
items = ["Decisions and their reasons", "Attempts and their results", "Questions still open"]

[scenes.roles]
kind = "card"
template = "bullets"
title = "Your agent. Our saved context."
items = ["The model reasons", "The agent uses its tools", "My records carry the context"]

[scenes.continuity]
kind = "card"
template = "bullets"
title = "Carry the thread forward"
items = ["Work in this session", "Save decisions and sources", "Continue in the next session"]

[scenes.uses]
kind = "card"
template = "bullets"
title = "Work worth continuing"
items = ["Coding projects", "Research and writing", "Learning over time"]

[scenes.code]
kind = "card"
template = "bullets"
title = "Pick up the code"
items = ["Why this design?", "What did we try?", "What is left to test?"]

[scenes.research]
kind = "card"
template = "bullets"
title = "Keep research connected"
items = ["The question", "The sources", "What remains open"]

[scenes.learning]
kind = "card"
template = "bullets"
title = "Build on each session"
items = ["Feedback worth keeping", "Questions to revisit", "The next step"]

[scenes.start]
kind = "card"
template = "title"
title = "Start with one real task"
subtitle = "Tell me what you are working on"

[scenes.save]
kind = "card"
template = "bullets"
title = "Save what matters"
items = ["Connect memory tools", "Or save a handoff", "Check that it was saved"]

[scenes.questions]
kind = "card"
template = "bullets"
