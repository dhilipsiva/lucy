<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucy D — AI memory. With a personality. — her room</title>
<meta name="description" content="Lucy D: AI memory. With a personality. Peer-to-peer, cross-agent, and model-agnostic. Talk with her in her browser room: scripted from her public memory, or through her own small model, your provider or your Ollama.">
<meta property="og:title" content="Lucy D — her room">
<meta property="og:description" content="AI memory. With a personality. Peer-to-peer, cross-agent, and model-agnostic. Meet Lucy in her browser room.">
<link rel="icon" href="./assets/mark.svg">
<link rel="stylesheet" href="./styles.css">
</head>
<body class="view-chat">
<!-- The conversation at the centre of my room (roadmap/N9.md): this skeleton paints at once; the
     WebAssembly fills it in. -->
<main id="ask" class="ask" aria-label="Talk with Lucy">
<header class="ask-head">
<p class="ask-title"><span class="ask-name">Lucy</span><span class="ask-stop">.</span><span id="ask-pill" class="ask-pill">WAKING</span></p>
<nav class="ask-actions" aria-label="My room">
<button id="ask-model" class="q-btn" type="button" data-action="panel" data-value="model" aria-haspopup="true">Model: Scripted ▾</button>
<button class="q-btn" type="button" data-action="panel" data-value="garage" aria-haspopup="true">Garage</button>
<button class="q-btn" type="button" data-action="scene">Scene ◐</button>
<button class="q-btn" type="button" data-action="panel" data-value="more" aria-label="My memory and this conversation">⋯</button>
<a class="q-btn ask-home" href="https://dhilipsiva.dev/lucy/">← Lucy</a>
</nav>
</header>
<section id="ask-panel" class="ask-panel" hidden></section>
<p id="ask-notice" class="ask-notice" role="status" hidden></p>
<div id="ask-log" class="ask-log" role="log" aria-live="polite" aria-label="Conversation"></div>
<nav id="ask-chips" class="ask-chips" aria-label="Ask me about someone in my memory"></nav>
<div class="ask-composer"><span class="ask-prompt" aria-hidden="true">❯</span><textarea id="ask-input" rows="1" placeholder="Ask Lucy…" autocomplete="off" aria-label="Ask Lucy. Enter sends; Shift Enter adds a line."></textarea><button id="ask-send" class="q-btn primary" type="button">Send →</button></div>
<p class="ask-hint">Enter sends · Shift+Enter adds a line · this conversation stays in this browser</p>
</main>
<button id="ask-return" class="room-return" type="button">← Conversation</button>
<canvas id="scene" aria-label="Lucy's room: a WebGL2 scene; her words are mirrored below for readers"></canvas>
<a class="room-back" href="https://dhilipsiva.dev/lucy/">← Back to Lucy</a>
<!-- The browser loads a font only when the page uses it; these spans ask for the four faces the panels draw with. -->
<div class="font-preload" aria-hidden="true"><span style="font:400 13px 'IBM Plex Mono'">a</span><span style="font:500 13px 'IBM Plex Mono'">a</span><span style="font:400 15px 'IBM Plex Sans'">a</span><span style="font:600 19px 'Space Grotesk'">a</span></div>
<!-- Text mirrors of what the room shows, for screen readers and the headless test; not interface. -->
<div id="status" class="sr" aria-live="polite">Loading the engine…</div>
<div id="mindline" class="sr"></div>
<div id="garage-status" class="sr" aria-live="polite"></div>
<div id="answer" class="sr" aria-live="polite"></div>
<textarea id="composer-input" class="sr" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Talk to Lucy. Enter sends; Shift Enter adds a line."></textarea>
<div id="journal-status" class="sr" aria-live="polite"></div>
<div id="words-status" class="sr" aria-live="polite"></div>
<div id="drawer" class="sr"></div>
<pre id="log" class="sr"></pre>
<pre id="wake-terminal" class="sr" aria-live="polite" aria-label="Automatic wake simulation. Press Escape to close."></pre>
<a id="room-link" class="sr" href="https://dhilipsiva.dev/lucy/room/" target="_blank" rel="noopener noreferrer">Visit my public room</a>
<noscript><p class="note">Lucy's room runs as WebAssembly in your browser; it needs scripting on to load.</p></noscript>
<!-- The only script of mine: the loader wasm-bindgen generates, and this call into it. -->
<script type="module">import init from './pkg/lucy_room.js'; init();</script>
</body>
</html>
