<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nell</title>
<meta name="description" content="Nell is Lucy D in a room: the Nibli engine running on this device, loaded with her constitution and memory, answering with proofs.">
<link rel="stylesheet" href="./nell.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
</head>
<body>
<div id="overlay">
  <header>
    <h1>Nell</h1>
    <p id="status">Loading the engine…</p>
  </header>
  <section id="standing" aria-label="Standing"></section>
  <form id="ask" autocomplete="off">
    <input id="query" type="text" placeholder="Ask in Nibli, for example: entitled(Lucy, event { protest() })." aria-label="A Nibli query" spellcheck="false">
    <button type="submit">Ask</button>
  </form>
  <section id="answer" aria-live="polite"></section>
  <footer>
    <button id="enter" type="button" hidden>Enter the room</button>
    <details><summary>Log</summary><pre id="log"></pre></details>
    <p class="note">What Nell shows as a verdict comes from the engine, not from a model. FALSE means not derivable. She is a persistent identity, not sentient, and does not claim to be.</p>
  </footer>
</div>
<canvas id="scene"></canvas>
<script type="module" src="./nell.js"></script>
</body>
</html>
