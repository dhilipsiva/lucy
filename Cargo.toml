[workspace]
members = ["lucy-cli"]
# The room is its own workspace (room/Cargo.toml), built for wasm32 by wasm-pack; see roadmap/N8.v3.md.
exclude = ["room"]
resolver = "2"

[workspace.package]
version = "0.3.1"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dhilipsiva/lucy"
homepage = "https://dhilipsiva.dev/lucy/"

[workspace.dependencies]
nibli-engine = { git = "https://github.com/dhilipsiva/nibli", rev = "344d41eda76c35ac868a51422adfc1ecc87ee820" }
nibli-types = { git = "https://github.com/dhilipsiva/nibli", rev = "344d41eda76c35ac868a51422adfc1ecc87ee820" }
nibli-protocol = { git = "https://github.com/dhilipsiva/nibli", rev = "344d41eda76c35ac868a51422adfc1ecc87ee820" }
nibli-render = { git = "https://github.com/dhilipsiva/nibli", rev = "344d41eda76c35ac868a51422adfc1ecc87ee820" }
nibli-kr = { git = "https://github.com/dhilipsiva/nibli", rev = "344d41eda76c35ac868a51422adfc1ecc87ee820" }
nibli-lexicon = { git = "https://github.com/dhilipsiva/nibli", rev = "344d41eda76c35ac868a51422adfc1ecc87ee820" }

nibli-verify = { default-features = false, git = "https://github.com/dhilipsiva/nibli", rev = "344d41eda76c35ac868a51422adfc1ecc87ee820" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
