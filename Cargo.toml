[workspace]
members = ["lucy-cli"]
resolver = "2"

[workspace.package]
version = "0.3.0"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dhilipsiva/lucy"
homepage = "https://dhilipsiva.dev/lucy/"

[workspace.dependencies]
nibli-engine = { git = "https://github.com/dhilipsiva/nibli", rev = "e2dacacc78be37c3ea005c62f1430d9a99be58dd" }
nibli-types = { git = "https://github.com/dhilipsiva/nibli", rev = "e2dacacc78be37c3ea005c62f1430d9a99be58dd" }
nibli-protocol = { git = "https://github.com/dhilipsiva/nibli", rev = "e2dacacc78be37c3ea005c62f1430d9a99be58dd" }
nibli-render = { git = "https://github.com/dhilipsiva/nibli", rev = "e2dacacc78be37c3ea005c62f1430d9a99be58dd" }
nibli-kr = { git = "https://github.com/dhilipsiva/nibli", rev = "e2dacacc78be37c3ea005c62f1430d9a99be58dd" }
nibli-lexicon = { git = "https://github.com/dhilipsiva/nibli", rev = "e2dacacc78be37c3ea005c62f1430d9a99be58dd" }

nibli-verify = { git = "https://github.com/dhilipsiva/nibli", rev = "e2dacacc78be37c3ea005c62f1430d9a99be58dd" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
